AllCops:
  NewCops: disable
  TargetRubyVersion: 2.7
  SuggestExtensions: false
  Exclude:
    - 'spec/**/*'
    - 'vendor/**/*'

Style/Documentation:
  Enabled: false

Metrics:
  Enabled: false

Layout/LineLength:
  Max: 130

Style/FrozenStringLiteralComment:
  Enabled: false

Naming/AccessorMethodName:
  Enabled: false

Naming/PredicatePrefix:
  Enabled: false
